name: Build APK + Magisk Module

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Assemble Debug & Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble staged sources (HomeScreen + legacy)
        run: |
          if [ -f patches/v1.16.0/assemble.sh ]; then
            chmod +x patches/v1.16.0/assemble.sh
            bash patches/v1.16.0/assemble.sh || echo 'v1 assemble skipped (v2 GL path is primary)'
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle Wrapper
        working-directory: manager-app
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: manager-app
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        working-directory: manager-app
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCam-Manager-debug
          path: manager-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCam-Manager-release
          path: manager-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  build-magisk:
    name: Package Magisk Module (+ Zygisk GL v2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true
        continue-on-error: true

      - name: Fetch zygisk.hpp
        run: |
          mkdir -p zygisk-native/jni
          curl -fsSL -o zygisk-native/jni/zygisk.hpp \
            https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp

      - name: Fetch ShadowHook runtime libs (optional)
        run: |
          mkdir -p /tmp/sh-aar magisk-module/libs
          # Try Maven Central AAR for prebuilt native libs
          VER=1.0.10
          URL="https://repo1.maven.org/maven2/com/bytedance/android/shadowhook/${VER}/shadowhook-${VER}.aar"
          if curl -fsSL -o /tmp/sh-aar/sh.aar "$URL"; then
            cd /tmp/sh-aar && unzip -oq sh.aar
            for ABI in arm64-v8a armeabi-v7a x86_64; do
              if [ -f jni/$ABI/libshadowhook.so ]; then
                mkdir -p $GITHUB_WORKSPACE/magisk-module/libs/$ABI
                cp jni/$ABI/libshadowhook.so $GITHUB_WORKSPACE/magisk-module/libs/$ABI/
                echo "ShadowHook $ABI $(stat -c%s jni/$ABI/libshadowhook.so) bytes"
              fi
            done
          else
            echo "WARN: could not download ShadowHook AAR — hooks will report pending"
          fi

      - name: Verify v2 GL native sources
        run: |
          test -f zygisk-native/jni/main.cpp
          test -f zygisk-native/jni/gl_hooks.cpp
          test -f zygisk-native/jni/gl_hooks.h
          grep -n 'install_gl_hooks\|2\.0\.0' zygisk-native/jni/main.cpp
          grep -n 'yuv420sp_to_rgb\|ensure_upload_texture\|load_shadowhook\|hooked_glDrawElements\|fill_test_pattern' zygisk-native/jni/gl_hooks.cpp
          grep -n 'max-page-size=16384\|GLESv2\|mediandk' zygisk-native/CMakeLists.txt
          grep -n '2\.0\.0' magisk-module/module.prop

      - name: Build Zygisk native with CMake (GL + MediaCodec)
        if: steps.setup-ndk.outcome == 'success'
        working-directory: zygisk-native
        run: |
          export NDK=${{ steps.setup-ndk.outputs.ndk-path }}
          mkdir -p ../magisk-module/zygisk
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            echo "=== Building $ABI ==="
            BUILD_DIR=build-$ABI
            cmake -B $BUILD_DIR \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-26 \
              -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=Release \
              || { echo "cmake configure failed for $ABI"; continue; }
            cmake --build $BUILD_DIR -j$(nproc) \
              || { echo "cmake build failed for $ABI"; continue; }
            SO=$(find $BUILD_DIR -name "libvirtualcam.so" | head -1)
            if [ -n "$SO" ] && [ -f "$SO" ]; then
              case $ABI in
                arm64-v8a)   OUT=arm64-v8a.so ;;
                armeabi-v7a) OUT=armeabi-v7a.so ;;
                x86_64)      OUT=x86_64.so ;;
              esac
              cp "$SO" ../magisk-module/zygisk/$OUT
              echo "Packaged $OUT ($(stat -c%s ../magisk-module/zygisk/$OUT) bytes)"
            else
              echo "No libvirtualcam.so for $ABI"
            fi
          done
          ls -la ../magisk-module/zygisk/ || true

      - name: Package Magisk zip (v2.0.0-dev)
        run: |
          # Place primary ABI shadowhook next to module for dlopen fallback
          if [ -f magisk-module/libs/arm64-v8a/libshadowhook.so ]; then
            cp magisk-module/libs/arm64-v8a/libshadowhook.so magisk-module/libshadowhook.so
          fi
          cd magisk-module
          zip -r ../VirtualCam-Manager-Magisk-v2.0.0-dev.zip .
          ls -la ../VirtualCam-Manager-Magisk-v2.0.0-dev.zip
          unzip -l ../VirtualCam-Manager-Magisk-v2.0.0-dev.zip | head -40

      - name: Upload Magisk zip
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCam-Manager-Magisk-v2.0.0-dev
          path: VirtualCam-Manager-Magisk-v2.0.0-dev.zip
          if-no-files-found: error
