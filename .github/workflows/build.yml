name: Build APK + Magisk Module

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Assemble Debug & Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle Wrapper
        working-directory: manager-app
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: manager-app
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        working-directory: manager-app
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCam-Manager-debug
          path: manager-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCam-Manager-release
          path: manager-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  build-magisk:
    name: Package Magisk Module (+ Zygisk ArtHook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true
        continue-on-error: true

      - name: Fetch zygisk.hpp
        run: |
          mkdir -p zygisk-native/jni
          curl -fsSL -o zygisk-native/jni/zygisk.hpp \
            https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp

      - name: Fetch ArtHook sources
        run: |
          mkdir -p zygisk-native/third_party
          rm -rf zygisk-native/third_party/arthook
          git clone --depth 1 https://github.com/aimardcr/ArtHook.git zygisk-native/third_party/arthook
          rm -rf zygisk-native/third_party/arthook/.git \
                 zygisk-native/third_party/arthook/tests \
                 zygisk-native/third_party/arthook/examples
          ls -la zygisk-native/third_party/arthook/
          ls zygisk-native/third_party/arthook/include/arthook/
          test -f zygisk-native/third_party/arthook/include/arthook/ArtHook.h
          test -f zygisk-native/third_party/arthook/src/hook/HookEngine.cpp

      - name: Apply main.cpp v1.15.0 NV21 wiring patch
        run: |
          patch -p1 < patches/v1.15.0-main.cpp.patch
          grep -n install_preview_callback_hooks zygisk-native/jni/main.cpp && grep -n nv21_hooks.h zygisk-native/jni/main.cpp

      - name: Build Zygisk native with CMake + ArtHook
        if: steps.setup-ndk.outcome == 'success'
        working-directory: zygisk-native
        run: |
          export NDK=${{ steps.setup-ndk.outputs.ndk-path }}
          mkdir -p ../magisk-module/zygisk
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            echo "=== Building $ABI ==="
            BUILD_DIR=build-$ABI
            cmake -B $BUILD_DIR \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-26 \
              -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=Release \
              || { echo "cmake configure failed for $ABI"; continue; }
            cmake --build $BUILD_DIR -j$(nproc) \
              || { echo "cmake build failed for $ABI"; continue; }
            SO=$(find $BUILD_DIR -name "libvirtualcam.so" | head -1)
            if [ -n "$SO" ] && [ -f "$SO" ]; then
              case $ABI in
                arm64-v8a)   OUT=arm64-v8a.so ;;
                armeabi-v7a) OUT=armeabi-v7a.so ;;
                x86_64)      OUT=x86_64.so ;;
              esac
              cp "$SO" ../magisk-module/zygisk/$OUT
              echo "Packaged $OUT ($(stat -c%s ../magisk-module/zygisk/$OUT) bytes)"
            else
              echo "No libvirtualcam.so for $ABI"
            fi
          done
          ls -la ../magisk-module/zygisk/ || true

      - name: Package Magisk zip
        run: |
          cd magisk-module
          zip -r ../VirtualCam-Manager-Magisk-v1.15.0.zip .
          ls -la ../VirtualCam-Manager-Magisk-v1.15.0.zip
          unzip -l ../VirtualCam-Manager-Magisk-v1.15.0.zip

      - name: Upload Magisk zip
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCam-Manager-Magisk-v1.15.0
          path: VirtualCam-Manager-Magisk-v1.15.0.zip
          if-no-files-found: error
